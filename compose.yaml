services:
  backend:
    image: myproject-backend:${BUILD_NUMBER}
    container_name: myproject-backend
    ports:
      - "8000:8000"

  frontend:
    image: myproject-frontend:${BUILD_NUMBER}
    container_name: myproject-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend